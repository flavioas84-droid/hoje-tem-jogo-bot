name: Resultados Hoje Tem Jogo
on:
  schedule:
    - cron: "*/15 14-23 * * *"   # 11h00 a 20h45 (Brasília)
    - cron: "*/15 0-2 * * *"     # 21h00 a 23h45 (Brasília)
  workflow_dispatch: {}
permissions:
  contents: write
concurrency:
  group: canal
  cancel-in-progress: false
jobs:
  postar:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Postar resultados novos
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
        run: python3 agenda/resultados.py
      - name: Salvar posts.json
        run: |
          if ! git diff --quiet posts.json; then
            git config user.name "hoje-tem-jogo-bot"
            git config user.email "actions@users.noreply.github.com"
            git add posts.json
            git commit -m "Resultados publicados"
            git pull --rebase
            git push
          fi
